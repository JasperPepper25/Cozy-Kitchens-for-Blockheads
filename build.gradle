plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.2.1'
group = 'dev.fineedge.cozykitchens'
base { archivesName = 'cozy-kitchens-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
if (project.hasProperty('withGameTests')) {
 sourceSets.main.java.srcDir 'src/gametest/java'
 sourceSets.main.resources.srcDir 'src/gametest/resources'
}
if (project.hasProperty('withClientTests')) {
 sourceSets.main.java.srcDir 'src/clienttest/java'
}
if (project.hasProperty('withBackport')) {
 dependencies {
  runtimeOnly fg.deobf('maven.modrinth:vanillabackport:1.1.7.10')
  runtimeOnly fg.deobf('maven.modrinth:platform:1.3.4')
 }
}
if (project.hasProperty('withFurniture')) {
 dependencies {
  runtimeOnly fg.deobf('local:cozy_home:3.0.4-forge-1.20.1')
  runtimeOnly fg.deobf('maven.modrinth:cluttered:3.0.3-1.20.1')
 }
}
minecraft {
 mappings channel: 'official', version: '1.20.1'
 accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
 runs {
  configureEach {
   workingDirectory project.file('run')
   property 'forge.logging.console.level', 'info'
   property 'mixin.env.remapRefMap', 'true'
   property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
   mods { cozykitchens { source sourceSets.main } }
  }
  client {}
  server { args '--nogui' }
  gameTestServer { property 'forge.enabledGameTestNamespaces', 'cozykitchens' }
 }
}
repositories {
 flatDir { dirs 'vendor'; content { includeGroup 'local' } }
 maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
 minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
 implementation fg.deobf('maven.modrinth:cooking-for-blockheads:16.0.15+forge-1.20.1')
 implementation fg.deobf('maven.modrinth:balm:7.3.43+forge-1.20.1')
}
tasks.named('jar', Jar).configure {
 from('LICENSE')
 from('THIRD_PARTY_NOTICES.md')
 preserveFileTimestamps = false
 reproducibleFileOrder = true
 manifest.attributes('Implementation-Title': 'Cozy Kitchens for Blockheads', 'Implementation-Version': project.version)
 finalizedBy 'reobfJar'
}
tasks.named('processResources', ProcessResources).configure {
 doFirst { delete destinationDir }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
